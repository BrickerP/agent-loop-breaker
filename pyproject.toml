[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-loop-breaker"
version = "0.1.0"
description = "Trip agent goodbye / tool-retry dead-loops mid-run — append-only log, configurable break rules, one-command demo."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yupeng Lu" }]
keywords = ["ai-agents", "loop-breaker", "guardrails", "mcp", "evals", "observability"]
dependencies = []

[project.urls]
Homepage = "https://github.com/BrickerP/agent-loop-breaker"
Hire = "https://brickerp.github.io/hire/"

[project.scripts]
agent-loop-breaker = "agent_loop_breaker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
